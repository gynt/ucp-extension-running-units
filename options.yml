meta:
  version: 1.0.0
options:
- display: GroupBox
  text: '{{general_descr}}'
  category:
  - '{{balance_changes}}'
  children:
  - display: UCP2Switch
    header: '{{macemen_running_general}}'
    children:
    - url: running-units.macemen.running.ai
      name: running-units-macemen-running-ai
      hasHeader: false
      text: '{{ai_rules}}'
      display: RadioGroup
      enabled: running-units.macemen.running.general
      contents:
        value: aic_run_if_not_defined
        choices:
        - name: aic_ignore_run
          text: '{{aic_ignore_run}}'
        - name: aic_ignore_walk
          text: '{{aic_ignore_walk}}'
        - name: aic_run_if_not_defined
          text: '{{aic_run_if_not_defined}}'
        - name: aic_walk_if_not_defined
          text: '{{aic_walk_if_not_defined}}'
    name: running-units-macemen-running-general
    url: running-units.macemen.running.general
    contents:
      type: boolean
      value: false
  - display: UCP2Switch
    header: '{{slingers_running_general}}'
    children:
    - url: running-units.slingers.running.ai
      name: running-units-slingers-running-ai
      hasHeader: false
      text: '{{ai_rules}}'
      display: RadioGroup
      enabled: running-units.slingers.running.general
      contents:
        value: aic_run_if_not_defined
        choices:
        - name: aic_ignore_run
          text: '{{aic_ignore_run}}'
        - name: aic_ignore_walk
          text: '{{aic_ignore_walk}}'
        - name: aic_run_if_not_defined
          text: '{{aic_run_if_not_defined}}'
        - name: aic_walk_if_not_defined
          text: '{{aic_walk_if_not_defined}}'
    name: running-units-slingers-running-general
    url: running-units.slingers.running.general
    contents:
      type: boolean
      value: false
  - display: UCP2Switch
    header: '{{slaves_running_general}}'
    children:
    - url: running-units.slaves.running.ai
      name: running-units-slaves-running-ai
      hasHeader: false
      text: '{{ai_rules}}'
      display: RadioGroup
      enabled: running-units.slaves.running.general
      contents:
        value: aic_run_if_not_defined
        choices:
        - name: aic_ignore_run
          text: '{{aic_ignore_run}}'
        - name: aic_ignore_walk
          text: '{{aic_ignore_walk}}'
        - name: aic_run_if_not_defined
          text: '{{aic_run_if_not_defined}}'
        - name: aic_walk_if_not_defined
          text: '{{aic_walk_if_not_defined}}'
    name: running-units-slaves-running-general
    url: running-units.slaves.running.general
    contents:
      type: boolean
      value: false
  - display: UCP2Switch
    header: '{{spearmen_running_general}}'
    children:
    - url: running-units.spearmen.running.ai
      name: running-units-spearmen-running-ai
      hasHeader: false
      text: '{{ai_rules}}'
      display: RadioGroup
      enabled: running-units.spearmen.running.general
      contents:
        value: aic_run_if_not_defined
        choices:
        - name: aic_ignore_run
          text: '{{aic_ignore_run}}'
        - name: aic_ignore_walk
          text: '{{aic_ignore_walk}}'
        - name: aic_run_if_not_defined
          text: '{{aic_run_if_not_defined}}'
        - name: aic_walk_if_not_defined
          text: '{{aic_walk_if_not_defined}}'
    name: running-units-spearmen-running-general
    url: running-units.spearmen.running.general
    contents:
      type: boolean
      value: false
  name: running_units
  header: '{{title}}'
  accordion:
    enabled: true
